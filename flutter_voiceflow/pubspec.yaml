name: voiceflow
description: AI-Powered Voice Transcription App - Flutter version
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Backend
  supabase_flutter: ^2.5.6
  http: ^1.1.2

  # Audio Recording & Playback
  record: ^5.1.2
  just_audio: ^0.9.36
  audio_service: ^0.18.11
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path: ^1.8.3

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Animations
  flutter_animate: ^4.3.0
  lottie: ^2.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  dio: ^5.4.0
  openai_dart: ^1.0.3

  # UI Helpers
  fluttertoast: ^8.2.4
  flutter_haptic_feedback: ^0.6.0
  url_launcher: ^6.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
